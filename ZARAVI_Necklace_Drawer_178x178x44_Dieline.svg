<rect x="78" y="343" width="14" height="175.4" class="glue"/><rect x="267.4" y="343" width="14" height="175.4" class="glue"/>
<text x="179.7" y="432" class="t" text-anchor="middle">BASE 175.4 × 175.4</text><text x="179.7" y="325" class="t" text-anchor="middle">REAR WALL 41</text><text x="179.7" y="543" class="t" text-anchor="middle">FRONT WALL 41</text><text x="70" y="431" class="t" transform="rotate(-90 70 431)" text-anchor="middle">SIDE WALL 41</text><text x="291" y="431" class="t" transform="rotate(90 291 431)" text-anchor="middle">SIDE WALL 41</text>
<!-- insert -->
<text x="338" y="301" class="h">D · NECKLACE PLATFORM</text><text x="338" y="310" class="t">1.0 mm molded fiber, 0.6 mm plant suede laminate, removable cotton pull-tab beneath.</text>
<rect x="338" y="320" width="173.6" height="173.6" rx="3" class="cut"/><path d="M390 365c28 52 42 79 35 115M460 365c-28 52-42 79-35 115" class="crease"/><circle cx="390" cy="365" r="2.5" class="cut"/><circle cx="460" cy="365" r="2.5" class="cut"/><path d="M418 479h14" class="cut"/><text x="424.8" y="505" class="micro" text-anchor="middle">173.6 × 173.6 · R3 · CHAIN CHANNEL DEPTH 1.5 · PENDANT SLOT 14 × 1.2</text>
<!-- logo and pull zones -->
<text x="538" y="301" class="h">E · VISIBLE FACE / PULL DETAIL</text><rect x="538" y="320" width="178" height="44" class="board"/><path d="M538 320C578 355 626 355 680 320M574 364C607 340 645 340 680 320" fill="none" stroke="#8DA28C" stroke-width=".28"/><rect x="617" y="354" width="20" height="18" fill="#A4530C"/><text x="627" y="384" class="micro" text-anchor="middle">10 MM COTTON PULL · 24 MM EXPOSED LOOP</text><rect x="538" y="399" width="178" height="95" class="note"/><text x="548" y="413" class="h">MANUFACTURING NOTES</text><text x="548" y="424" class="t">1. Prototype with final wrap and adhesive. Drawer running clearance: 1.0 to 1.3 mm per side.</text><text x="548" y="433" class="t">2. Structural grain follows 178 mm travel. Calibrate V-grooves to actual board lot before production.</text><text x="548" y="442" class="t">3. pH-neutral PVA, full coverage. Press wrapped sleeve under flat load for minimum 4 hours.</text><text x="548" y="451" class="t">4. Pull anchor: 45 × 25 mm reinforcement patch trapped under front wall laminate.</text><text x="548" y="460" class="t">5. Top wordmark: 38 mm wide, blind deboss 0.3 mm. Vein rule minimum 0.25 mm.</text><text x="548" y="469" class="t">6. Color: Mineral Sage #8DA28C, ΔE00 ≤ 2 under D50. Copper textile #A4530C.</text><text x="548" y="478" class="t">7. QC: squareness ±0.7 mm; face alignment ±0.6 mm; drawer pull force 1.2 to 2.2 N.</text><text x="548" y="487" class="t">8. Packed jewelry must pass 1 m six-face drop test inside approved e-commerce mailer.</text>
<!-- tolerances -->
<text x="739" y="301" class="h">F · TOLERANCE STACK</text><rect x="739" y="320" width="78" height="174" class="note"/><text x="748" y="335" class="t">Outer W/H</text><text x="808" y="335" class="t" text-anchor="end">±0.7</text><text x="748" y="348" class="t">Drawer W</text><text x="808" y="348" class="t" text-anchor="end">±0.4</text><text x="748" y="361" class="t">Board caliper</text><text x="808" y="361" class="t" text-anchor="end">±0.08</text><text x="748" y="374" class="t">Wrap register</text><text x="808" y="374" class="t" text-anchor="end">±0.6</text><text x="748" y="387" class="t">Deboss register</text><text x="808" y="387" class="t" text-anchor="end">±0.5</text><text x="748" y="400" class="t">Gap per side</text><text x="808" y="400" class="t" text-anchor="end">1.0–1.3</text><path d="M748 418h60" class="crease"/><text x="748" y="430" class="micro">All dimensions in mm.</text><text x="748" y="440" class="micro">Red lines: knife.</text><text x="748" y="450" class="micro">Cyan: V-groove/score.</text><text x="748" y="460" class="micro">Magenta: bleed/safe.</text><text x="748" y="470" class="micro">Green: adhesive.</text>
<!-- title block -->
<rect x="338" y="536" width="479" height="34" fill="#3A230A"/><text x="348" y="550" fill="#EEE9C1" class="h">ZARAVI PACKAGING ENGINEERING</text><text x="348" y="559" fill="#EEE9C1" class="micro">NECKLACE DRAWER · 178 × 178 × 44 MM · REV A · UNITS MM · SCALE 1:1 AT 100% · DO NOT FIT TO PAGE</text><text x="807" y="551" fill="#EEE9C1" class="h" text-anchor="end">03 SEP 2026</text>
</svg>