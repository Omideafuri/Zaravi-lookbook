<svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="594mm" viewBox="0 0 841 594">
<defs><style><![CDATA[
text{font-family:Arial,sans-serif;fill:#3A230A}.title{font-family:Georgia,serif;font-size:14px;letter-spacing:2.5px}.h{font-size:6px;font-weight:700;letter-spacing:.55px}.t{font-size:4.2px}.micro{font-size:3.5px}.cut{fill:none;stroke:#E1261C;stroke-width:.25}.crease{fill:none;stroke:#00AEEF;stroke-width:.22;stroke-dasharray:3 2}.safe{fill:none;stroke:#EC008C;stroke-width:.18;stroke-dasharray:1.5 1.5}.glue{fill:#86A387;fill-opacity:.18;stroke:#638064;stroke-width:.18}.dim{fill:none;stroke:#6A6257;stroke-width:.16;marker-start:url(#a);marker-end:url(#a)}.board{fill:#EEE9C1;stroke:#3A230A;stroke-width:.18}.note{fill:#F4F0D8;stroke:#8DA28C;stroke-width:.2}
]]></style><marker id="a" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M6 0L0 3l6 3" fill="none" stroke="#6A6257" stroke-width=".8"/></marker></defs>
<rect width="841" height="594" fill="#F8F5E7"/>
<text x="24" y="25" class="title">ZARAVI / NECKLACE ARCHIVE DRAWER</text><text x="24" y="35" class="h">FINISHED OUTER SIZE 178 × 178 × 44 MM · FOUR-PANEL RIGID SLEEVE · REV A · SCALE 1:1</text>
<line x1="645" y1="24" x2="663" y2="24" class="cut"/><text x="667" y="25.5" class="micro">CUT</text><line x1="702" y1="24" x2="720" y2="24" class="crease"/><text x="724" y="25.5" class="micro">V-GROOVE / CREASE</text><line x1="645" y1="33" x2="663" y2="33" class="safe"/><text x="667" y="34.5" class="micro">BLEED / SAFE</text><rect x="702" y="30" width="18" height="6" class="glue"/><text x="724" y="34.5" class="micro">GLUE</text>
<!-- sleeve structural -->
<text x="24" y="53" class="h">A · OUTER SLEEVE STRUCTURAL BLANK</text><text x="24" y="60" class="t">1.2 mm FSC compact board; 90° V-groove to 0.25 mm residual. Finished envelope calibrated after wrap: 178 × 178 × 44 mm.</text>
<rect x="21" y="66" width="462" height="184" class="safe"/>
<path d="M24 69H480V247H24Z" class="cut"/><rect x="24" y="69" width="12" height="178" class="glue"/><path d="M36 69V247M214 69V247M258 69V247M436 69V247" class="crease"/>
<text x="30" y="158" class="micro" text-anchor="middle" transform="rotate(-90 30 158)">12 GLUE</text><text x="125" y="158" class="t" text-anchor="middle">BOTTOM 178</text><text x="236" y="158" class="t" text-anchor="middle">SIDE 44</text><text x="347" y="158" class="t" text-anchor="middle">TOP 178</text><text x="458" y="158" class="t" text-anchor="middle">SIDE 44</text>
<line x1="24" y1="257" x2="480" y2="257" class="dim"/><text x="252" y="254.5" class="micro" text-anchor="middle">456.0</text><line x1="490" y1="69" x2="490" y2="247" class="dim"/><text x="494" y="158" class="micro" transform="rotate(90 494 158)" text-anchor="middle">178.0</text>
<!-- paper wrap -->
<text x="515" y="53" class="h">B · SLEEVE PAPER WRAP</text><text x="515" y="60" class="t">120 gsm dyed-through paper. 15 mm turn-in at open ends. Grain parallel to drawer travel.</text>
<path d="M515 69H821V277H515Z" class="cut"/><path d="M515 84H821M515 262H821" class="crease"/><path d="M527 69V277M705 69V277M749 69V277" class="crease"/><path d="M512 66H824V280H512Z" class="safe"/><text x="668" y="80" class="micro" text-anchor="middle">15 MM TURN-IN</text><text x="668" y="273" class="micro" text-anchor="middle">15 MM TURN-IN</text><text x="668" y="174" class="t" text-anchor="middle">WRAP SHOWN IN TWO-UP LENGTH, FINAL SEAM LOCATION TO UNDERSIDE</text>
<!-- tray -->
<text x="24" y="286" class="h">C · INNER DRAWER TRAY NET</text><text x="24" y="293" class="t">400 gsm SBS folding tray, 0.55 mm caliper, reinforced with 1.0 mm perimeter rails after forming. External target 175.4 × 176.0 × 41.2 mm.</text>
<!-- base 175x132 proportional display actual dims: base 175.4x132? Necklace square tray interior should 175.4x175.4. Full cross 257.8 square fits -->
<path class="cut" d="M78 343H92V302H267.4V343H281.4V518.4H267.4V559.4H92V518.4H78ZM92 343H51V518.4H92M267.4 343H308.4V518.4H267.4"/>
<path class="cut" d="M78 343l14 8M78 518.4l14-8M281.4 343l-14 8M281.4 518.4l-14-8"/>
