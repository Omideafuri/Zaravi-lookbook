<text x="248" y="186" class="h">D · JEWELRY INSERT</text><text x="248" y="193" class="t">Die-cut 1.0 mm molded fiber board, laminated with 0.6 mm plant suede. Friction fit, no exposed foam.</text>
<rect x="248" y="205" width="67.8" height="49.8" rx="2" class="cut"/><path d="M274 226c7-7 16-7 23 0M274 234c7 7 16 7 23 0" class="cut"/><text x="281.9" y="265" class="micro" text-anchor="middle">67.8 × 49.8 · R2 CORNERS · 22 MM RING SLOT</text>
<!-- artwork -->
<text x="348" y="186" class="h">E · ARTWORK ZONES</text><rect x="348" y="205" width="72" height="54" class="board"/><text x="384" y="231" class="title" text-anchor="middle" font-size="7">ZARAVI</text><path d="M356 251C370 224 388 214 412 210M356 251C376 242 396 226 412 210" fill="none" stroke="#8DA28C" stroke-width=".25"/><text x="384" y="269" class="micro" text-anchor="middle">TOP PANEL · WORDMARK 23 MM WIDE · BLIND DEBOSS 0.3 MM</text>
<!-- notes -->
<rect x="348" y="288" width="222" height="92" class="note"/><text x="358" y="302" class="h">MANUFACTURING NOTES</text><text x="358" y="313" class="t">1. Prototype before tooling. Maintain 0.8 to 1.0 mm drawer running clearance after wrap build-up.</text><text x="358" y="322" class="t">2. Compact board grain runs with drawer travel. Use 90° V-grooves; no crushed-score ridges on visible faces.</text><text x="358" y="331" class="t">3. Wrap adhesive: pH-neutral PVA, full coverage, low moisture. Turn-in sequence: long edges, then open ends.</text><text x="358" y="340" class="t">4. Copper pull: 10 mm cotton herringbone, 28 mm exposed loop; anchor between board and wrap over 35 mm.</text><text x="358" y="349" class="t">5. Color target: Mineral Sage #8DA28C, ΔE00 ≤ 2 under D50. Interior Warm Ivory #EEE9C1.</text><text x="358" y="358" class="t">6. Deboss only, no metallic foil. Minimum vein rule 0.25 mm; keep 5 mm from wrapped edges.</text><text x="358" y="367" class="t">7. QC: lid squareness ±0.5 mm, wrap registration ±0.6 mm, drawer pull 0.8 to 1.5 N.</text>
<!-- title block -->
<rect x="24" y="386" width="546" height="22" fill="#3A230A"/><text x="31" y="396" fill="#EEE9C1" class="h">ZARAVI PACKAGING ENGINEERING</text><text x="31" y="403" fill="#EEE9C1" class="micro">RING BOX · 72 × 72 × 54 MM · REV A · UNITS MM · SCALE 1:1 AT 100% · DO NOT FIT TO PAGE</text><text x="561" y="399" fill="#EEE9C1" class="h" text-anchor="end">03 SEP 2026</text>
