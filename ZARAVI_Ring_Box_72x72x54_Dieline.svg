<line x1="24" y1="151" x2="288" y2="151" class="dim"/><text x="156" y="148.5" class="micro" text-anchor="middle">264.0</text><line x1="298" y1="69" x2="298" y2="141" class="dim"/><text x="302" y="106" class="micro" transform="rotate(90 302 106)" text-anchor="middle">72.0</text>
<!-- wrap -->
<text x="324" y="53" class="h">B · SLEEVE PAPER WRAP</text><text x="324" y="60" class="t">Add 15 mm turn-in at open ends, 10 mm overlap at seam, grain parallel to 72 mm drawer travel.</text>
<path d="M324 66H588V168H324Z" class="cut"/><path d="M324 81H588M324 153H588" class="crease"/><path d="M336 66V168M408 66V168M462 66V168M534 66V168" class="crease"/><path d="M321 63H591V171H321Z" class="safe"/><text x="456" y="77" class="micro" text-anchor="middle">15 MM TURN-IN</text><text x="456" y="164" class="micro" text-anchor="middle">15 MM TURN-IN</text>
<!-- drawer tray folding net -->
<text x="24" y="186" class="h">C · INNER DRAWER TRAY NET</text><text x="24" y="193" class="t">400 gsm SBS, 0.55 mm nominal caliper, double-wall rolled rim; finished external target 69.6 × 70.0 × 51.4 mm.</text>
