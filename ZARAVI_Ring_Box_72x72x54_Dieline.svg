<defs><style><![CDATA[
text{font-family:Arial,sans-serif;fill:#3A230A}.title{font-family:Georgia,serif;font-size:12px;letter-spacing:2px}.h{font-size:6px;font-weight:700;letter-spacing:.5px}.t{font-size:4.1px}.micro{font-size:3.4px}.cut{fill:none;stroke:#E1261C;stroke-width:.25}.crease{fill:none;stroke:#00AEEF;stroke-width:.22;stroke-dasharray:3 2}.safe{fill:none;stroke:#EC008C;stroke-width:.18;stroke-dasharray:1.5 1.5}.glue{fill:#86A387;fill-opacity:.18;stroke:#638064;stroke-width:.18}.dim{fill:none;stroke:#6A6257;stroke-width:.16;marker-start:url(#a);marker-end:url(#a)}.board{fill:#EEE9C1;stroke:#3A230A;stroke-width:.18}.note{fill:#F4F0D8;stroke:#8DA28C;stroke-width:.2}.foldlabel{font-size:3.4px;fill:#00759A}.cutlabel{font-size:3.4px;fill:#B51F16}
]]></style><marker id="a" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M6 0L0 3l6 3" fill="none" stroke="#6A6257" stroke-width=".8"/></marker></defs>
<rect width="594" height="420" fill="#F8F5E7"/>
<text x="24" y="25" class="title">ZARAVI / RING ARCHIVE BOX</text><text x="24" y="34" class="h">FINISHED OUTER SIZE 72 × 72 × 54 MM · DRAWER WITH FOUR-PANEL SLEEVE · REV A · SCALE 1:1</text>
<!-- legend --> <line x1="410" y1="24" x2="428" y2="24" class="cut"/><text x="432" y="25.5" class="micro">CUT / KNIFE</text><line x1="474" y1="24" x2="492" y2="24" class="crease"/><text x="496" y="25.5" class="micro">CREASE / V-GROOVE</text><line x1="410" y1="33" x2="428" y2="33" class="safe"/><text x="432" y="34.5" class="micro">3 MM BLEED / ART LIMIT</text><rect x="474" y="30" width="18" height="6" class="glue"/><text x="496" y="34.5" class="micro">GLUE</text>
<!-- sleeve -->
<text x="24" y="53" class="h">A · OUTER SLEEVE STRUCTURAL BLANK</text><text x="24" y="60" class="t">1.2 mm FSC compact board, V-grooved to 0.25 mm residual; wrap separately in 120 gsm dyed-through Mineral Sage paper.</text>
